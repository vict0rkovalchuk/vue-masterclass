<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excersise 1</title>
  <link rel="stylesheet" href="https://unpkg.com/normalize.css/normalize.css">
  <style type="text/css">
    body {
      font-family: monospace;
      padding: 20px;
      font-size: 2em;
    }

    .can {
      color: green;
    }

    .cant {
      color: red;
    }
  </style>
  <script src="https://unpkg.com/vue@3.4.0"></script>
</head>

<body>
  <div id="app">
    <div>
      {{areWeDone ? `Your score: ${score}` : 'Next question'}}
    </div>
    <div>
      {{question}}
    </div>
    <div v-if="!areWeDone">
      <input v-model="answer" />
      <button @click="check">Check</button>
    </div>
  </div>
  <script>
    const { createApp, ref, computed } = Vue;
    const App = {
      setup() {
        const questions = [
          'How much is 2+2',
          'How much is 3*5+1',
          'What is the rest from 3/1'
        ];
        const answers = [
          '4',
          '16',
          '0'
        ];
        const score = ref(0);
        const current = ref(0);
        const answer = ref('');
        const question = computed(() => {
          return questions[current.value];
        });
        const rightAnswer = computed(() => {
          return answers[current.value];
        });
        const areWeDone = computed(() => {
          return questions.length === current.value;
        });
        const check = () => {
          if (answer.value === rightAnswer.value) {
            score.value += 1;
          }

          answer.value = '';
          current.value += 1;;
        }

        return {
          score,
          areWeDone,
          answer,
          question,
          check
        }
      },
    };
    createApp(App).mount('#app');
  </script>
</body>

</html>
