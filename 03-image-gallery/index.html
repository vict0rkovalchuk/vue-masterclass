<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Project 2</title>
  <link rel="stylesheet" href="https://unpkg.com/normalize.css/normalize.css">
  <style type="text/css">
    body {
      font-family: monospace;
      padding: 20px;
      font-size: 16px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
    }

    .photo {
      position: relative;
      border: 1px solid #ccc;
    }

    .photo img {
      width: 100%;
      display: block;
      height: 100%;
      object-fit: cover;
    }

    .favorite-button {
      background: none;
      border: none;
      color: #ccc;
      font-size: 24px;
      position: absolute;
      bottom: 5px;
      right: 5px;
      cursor: pointer;
    }

    .favorite-button.active {
      color: gold;
    }

    .no-photos {
      text-align: center;
      color: #999;
    }

    form {
      margin-bottom: 20px;
    }
  </style>
  <script src="https://unpkg.com/vue@3.4.0"></script>
</head>

<body>
  <div id="app">
    <!-- Form for Adding Photos -->
    <form @submit.prevent="addPhoto">
      <input placeholder="Enter image URL" v-model="url">
      <button :disabled="!url" type="submit">Add Photo</button>
    </form>

    <!-- Conditional Rendering -->
    <p v-if="!photos.length" class="no-photos">No photos added yet. Add some!</p>

    <div v-else class="gallery">
      <!-- List Rendering and Conditional Class Binding -->
      <div v-for="(photo) in photos" class="photo" :key="photo.id">
        <img @click="removePhoto(photo.id)" :src="photo.url" :alt="photo.id">
        <button @click="toggleFavorite(photo.id)" class="favorite-button" :class="{ active: photo.isFavourite }">
          ★
        </button>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;

    const App = {
      setup() {
        const photos = ref([]);
        const url = ref('');

        const addPhoto = () => {
          const newPhoto = {
            id: crypto.randomUUID(),
            url: url.value,
            isFavourite: false
          };

          photos.value.push(newPhoto);
          url.value = '';
        };

        const removePhoto = (id) => {
          photos.value = photos.value.filter(photo => photo.id != id);
        };

        const toggleFavorite = (id) => {
          photos.value = photos.value.map(photo => photo.id !== id ? photo : { ...photo, isFavourite: !photo.isFavourite });
        };

        return {
          addPhoto,
          removePhoto,
          toggleFavorite,
          photos,
          url
        }
      },
    };

    createApp(App).mount('#app');
  </script>
</body>

</html>
